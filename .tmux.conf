# set the number of lines in stdout that tmux will save (default: 2000)
set-option -g history-limit 50000

# Use vi or emacs-style key bindings in copy mode.
set-window-option -g mode-keys vi

# move windows left/right by one
bind -r '{' run "tmux swap-window -d -t -1"
bind -r '}' run "tmux swap-window -d -t +1"

# rebind last-window (prefix + l was remapped to pane-right above)
bind - last-window

# use the vim motion keys to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# use vim motion keys to resize pane
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# toggle status bar
bind b set-option status

set -g default-terminal "tmux-256color"

# reduce escape-time delay (important for vi/neovim users)
set -sg escape-time 10

# enable mouse support (click-to-focus, scroll)
set -g mouse on

# =======
#  THEME
# =======

set -g status-bg "#2E3440"
set -g status-fg "#D8DEE9"

set -g pane-border-style fg="#434C5E"
set -g pane-active-border-style fg="#88C0D0"

set -g message-style fg="#2E3440",bg="#88C0D0"
set -g message-command-style fg="#2E3440",bg="#88C0D0"
set -g mode-style fg="#2E3440",bg="#A3BE8C"

set -g status-left-length 20
set -g status-left '#[fg=#88C0D0,bg=black]#[fg=#2E3440,bg=#88C0D0] #S #[fg=#88C0D0,bg=#2E3440] #[default]'
set -g status-right-length 80
set -g status-right '#[fg=#88C0D0,bg=#2E3440]#[fg=#2E3440,bg=#88C0D0]  #(hostname -s)  %d-%b-%Y  %H:%M #[fg=#88C0D0,bg=black]#[default]'
set -g window-status-current-style fg="#2E3440",bg="#88C0D0",bold

