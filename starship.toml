# ======
# THEME
# ======

format = """
[](#2E3440)\
$username$hostname\
[](fg:#2E3440 bg:#3B4252)\
$directory\
[](fg:#3B4252 bg:#434C5E)\
$git_branch$git_status\
[](fg:#434C5E bg:#5E81AC)\
$c$cpp$rust\
[](fg:#5E81AC bg:#88C0D0)\
$python\
[](fg:#88C0D0 bg:#A3BE8C)\
$time\
[](fg:#A3BE8C)
[❯](fg:#88C0D0) \
"""

[username]
show_always = true
style_user = "bg:#2E3440 fg:#D8DEE9"
style_root = "bg:#2E3440 fg:#BF616A"
format = '[ $user ]($style)'

[hostname]
ssh_only = false
style = "bg:#2E3440 fg:#81A1C1"
format = '[ $hostname ]($style)'

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bg:#3B4252 fg:#E5E9F0"
format = "[  $path ]($style)"

[git_branch]
style = "bg:#434C5E fg:#EBCB8B"
format = '[  $branch ]($style)'

[git_status]
style = "bg:#434C5E fg:#D08770"
format = '[$all_status$ahead_behind ]($style)'

[c]
style = "bg:#5E81AC fg:#ECEFF4"
format = '[  $version ]($style)'

[cpp]
style = "bg:#5E81AC fg:#ECEFF4"
format = '[  $version ]($style)'

[rust]
style = "bg:#5E81AC fg:#ECEFF4"
format = '[ 🦀 $version ]($style)'

[python]
style = "bg:#88C0D0 fg:#2E3440"
format = '[ (\($virtualenv\))  ($version) ]($style)'

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:#A3BE8C fg:#2E3440"
format = '[  $time ]($style)'

